[package]
name = "htj2k-rs"
version = "0.1.0"
edition = "2024"

description = "A Rust library for converting DICOM images to HTJ2K lossless encoding."
license = "MIT"
repository = "https://github.com/KiyarashJ/htj2k-rs"
readme = "README.md"
keywords = ["dicom", "htj2k", "jpeg2000", "medical-imaging"]
categories = ["multimedia::images"]


[dependencies]
dicom = "0.10.0"
dicom-core = "0.10.1"
dicom-dictionary-std = "0.10.0"
dicom-object = "0.10.0"
dicom-pixeldata = { version = "0.10.0", features = ["ndarray"] }
dicom-transfer-syntax-registry = { version = "0.10.0", features = ["openjp2"] }
features = "0.10.0"
ndarray = { version = "0.17.2", features = ["rayon"] }
ndic-codestream = "0.2.5"
ndic-core = "0.2.5"
ndic-htj2k = "0.2.5"
rayon = "1.12.0"
